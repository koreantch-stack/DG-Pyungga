<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MBTI 성격 유형 검사</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#ffffff;--bg2:#f7f6f3;--bg3:#f0efe9;
  --text:#1a1a1a;--text2:#555;--text3:#999;
  --border:rgba(0,0,0,0.1);--border2:rgba(0,0,0,0.2);
  --radius:10px;--radius-lg:14px;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#1a1a1a;--bg2:#222;--bg3:#2a2a2a;
    --text:#f0efe9;--text2:#aaa;--text3:#666;
    --border:rgba(255,255,255,0.1);--border2:rgba(255,255,255,0.2);
  }
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:2rem 1rem}
.app{max-width:620px;margin:0 auto}
.screen{display:none}
.screen.active{display:block}

.header{text-align:center;margin-bottom:2.5rem}
.logo{font-size:11px;letter-spacing:0.15em;color:var(--text3);text-transform:uppercase;margin-bottom:0.75rem}
.title{font-size:28px;font-weight:600;color:var(--text);line-height:1.2;margin-bottom:0.5rem}
.subtitle{font-size:14px;color:var(--text2);line-height:1.7}

.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;background:var(--bg2);border-radius:var(--radius-lg);padding:1.5rem;margin-bottom:1.5rem}
.info-item{text-align:center}
.info-num{font-size:26px;font-weight:600;color:var(--text)}
.info-label{font-size:12px;color:var(--text3);margin-top:3px}

.start-btn{width:100%;background:var(--text);color:var(--bg);border:none;border-radius:var(--radius);padding:1rem;font-size:15px;cursor:pointer;font-family:inherit;font-weight:500;transition:opacity 0.15s}
.start-btn:hover{opacity:0.85}

.progress-label{font-size:12px;color:var(--text3);text-align:right;margin-bottom:6px}
.progress-bar{background:var(--border);border-radius:99px;height:3px;margin-bottom:2rem;overflow:hidden}
.progress-fill{height:100%;background:var(--text);border-radius:99px;transition:width 0.4s ease}

.question-card{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:2rem;margin-bottom:1.25rem}
.q-cat{font-size:11px;letter-spacing:0.12em;color:var(--text3);text-transform:uppercase;margin-bottom:1rem}
.q-text{font-size:17px;color:var(--text);line-height:1.6}

.options{display:flex;flex-direction:column;gap:10px}
.opt-btn{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius);padding:1rem 1.25rem;text-align:left;cursor:pointer;font-size:15px;color:var(--text);line-height:1.5;transition:all 0.15s;font-family:inherit}
.opt-btn:hover{border-color:var(--border2);background:var(--bg2)}
.opt-btn.selected{border-color:var(--text);background:var(--bg2);font-weight:500}

.nav{display:flex;justify-content:space-between;align-items:center;margin-top:1.5rem}
.btn-prev{background:none;border:0.5px solid var(--border);border-radius:var(--radius);padding:0.65rem 1.25rem;font-size:13px;color:var(--text2);cursor:pointer;font-family:inherit}
.btn-prev:hover{border-color:var(--border2)}
.btn-next{background:var(--text);color:var(--bg);border:none;border-radius:var(--radius);padding:0.65rem 1.5rem;font-size:13px;cursor:pointer;font-family:inherit;font-weight:500;transition:opacity 0.15s}
.btn-next:disabled{opacity:0.25;cursor:default}

.result-badge{text-align:center;margin-bottom:2rem}
.type-emoji{font-size:44px;margin-bottom:0.5rem}
.type-code{font-size:52px;font-weight:700;letter-spacing:0.06em;color:var(--text)}
.type-name{font-size:16px;color:var(--text2);margin-top:4px}

.section-title{font-size:11px;letter-spacing:0.12em;color:var(--text3);text-transform:uppercase;margin-bottom:0.9rem}
.trait-row{margin-bottom:1.1rem}
.trait-labels{display:flex;justify-content:space-between;font-size:12px;color:var(--text2);margin-bottom:5px}
.trait-bar-bg{background:var(--bg3);border-radius:99px;height:6px;overflow:hidden}
.trait-bar-fill{height:100%;border-radius:99px;background:var(--text);transition:width 1s ease}
.trait-pct{font-size:11px;color:var(--text3);text-align:center;margin-top:4px}

.desc-card{background:var(--bg2);border-radius:var(--radius);padding:1.25rem;margin-bottom:1.75rem}
.desc-card p{font-size:14px;color:var(--text2);line-height:1.75}

.traits-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:1.75rem}
.trait-chip{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius);padding:0.85rem 1rem}
.trait-chip-title{font-size:14px;font-weight:600;color:var(--text);margin-bottom:3px}
.trait-chip-desc{font-size:12px;color:var(--text2);line-height:1.4}

.compat-item{display:flex;align-items:center;gap:14px;padding:1rem;background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius);margin-bottom:9px}
.compat-type-code{font-size:17px;font-weight:700;color:var(--text);min-width:52px}
.compat-info{flex:1}
.compat-name{font-size:13px;color:var(--text);margin-bottom:3px;font-weight:500}
.compat-desc{font-size:12px;color:var(--text3);line-height:1.4}
.compat-bar-wrap{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0}
.compat-bar{width:56px;height:4px;background:var(--bg3);border-radius:99px;overflow:hidden}
.compat-fill{height:100%;background:var(--text);border-radius:99px}
.compat-pct-label{font-size:10px;color:var(--text3)}

.restart-btn{width:100%;background:none;border:0.5px solid var(--border);border-radius:var(--radius);padding:0.85rem;font-size:14px;color:var(--text2);cursor:pointer;font-family:inherit;margin-top:0.75rem;transition:all 0.15s}
.restart-btn:hover{border-color:var(--border2);color:var(--text)}

.divider{border:none;border-top:0.5px solid var(--border);margin:1.5rem 0}
</style>
</head>
<body>
<div class="app">

  <div id="screen-start" class="screen active">
    <div class="header">
      <div class="logo">personality test</div>
      <h1 class="title">나는 어떤 사람인가</h1>
      <p class="subtitle">60개의 질문에 솔직하게 답하세요.<br>결과는 당신이 생각하는 것과 다를 수 있습니다.</p>
    </div>
    <div class="info-grid">
      <div class="info-item"><div class="info-num">60</div><div class="info-label">문항</div></div>
      <div class="info-item"><div class="info-num">5분</div><div class="info-label">소요</div></div>
    </div>
    <button class="start-btn" onclick="startTest()">검사 시작</button>
  </div>

  <div id="screen-test" class="screen">
    <div class="progress-label" id="prog-label">1 / 60</div>
    <div class="progress-bar"><div class="progress-fill" id="prog-fill" style="width:0%"></div></div>
    <div class="question-card">
      <div class="q-cat" id="q-cat"></div>
      <div class="q-text" id="q-text"></div>
    </div>
    <div class="options" id="options"></div>
    <div class="nav">
      <button class="btn-prev" id="btn-prev" onclick="prevQ()">← 이전</button>
      <button class="btn-next" id="btn-next" onclick="nextQ()" disabled>다음 →</button>
    </div>
  </div>

  <div id="screen-result" class="screen">
    <div class="result-badge">
      <div class="type-emoji" id="res-emoji"></div>
      <div class="type-code" id="res-code"></div>
      <div class="type-name" id="res-name"></div>
    </div>
    <div class="section-title">지표 분석</div>
    <div id="trait-bars" style="margin-bottom:1.75rem"></div>
    <hr class="divider">
    <div class="section-title">유형 설명</div>
    <div class="desc-card" id="res-desc"></div>
    <div class="section-title">주요 특성</div>
    <div class="traits-grid" id="res-traits"></div>
    <hr class="divider">
    <div class="section-title">궁합</div>
    <div id="res-compat" style="margin-bottom:1.5rem"></div>
    <button class="start-btn" onclick="restart()">결과 공유 / 다시 검사</button>
    <button class="restart-btn" onclick="restart()">처음으로</button>
  </div>

</div>

let answers=new Array(60).fill(null);
let current=0;

function startTest(){showScreen('screen-test');renderQ();}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0);}

function renderQ(){
  const q=QUESTIONS[current];
  document.getElementById('q-cat').textContent=q.cat;
  document.getElementById('q-text').textContent=q.text;
  document.getElementById('prog-label').textContent=(current+1)+' / 60';
  document.getElementById('prog-fill').style.width=((current+1)/60*100)+'%';
  document.getElementById('btn-prev').style.visibility=current===0?'hidden':'visible';
  const nb=document.getElementById('btn-next');
  nb.textContent=current===59?'결과 보기 →':'다음 →';
  nb.disabled=answers[current]===null;
  const opts=document.getElementById('options');
  opts.innerHTML=`
    <button class="opt-btn${answers[current]==='a'?' selected':''}" onclick="selectOpt('a')">${q.a}</button>
    <button class="opt-btn${answers[current]==='b'?' selected':''}" onclick="selectOpt('b')">${q.b}</button>`;
}

function selectOpt(v){
  answers[current]=v;
  document.querySelectorAll('.opt-btn').forEach((b,i)=>{b.classList.toggle('selected',(i===0&&v==='a')||(i===1&&v==='b'));});
  document.getElementById('btn-next').disabled=false;
}

function nextQ(){if(answers[current]===null)return;if(current===59){showResult();return;}current++;renderQ();}
function prevQ(){if(current===0)return;current--;renderQ();}

function getOpposite(d){return{E:'I',I:'E',S:'N',N:'S',T:'F',F:'T',J:'P',P:'J'}[d];}

function calcType(){
  const scores={E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0};
  QUESTIONS.forEach((q,i)=>{
    if(answers[i]===null)return;
    const dir=answers[i]==='a'?q.aDir:getOpposite(q.aDir);
    scores[dir]++;
  });
  const type=(scores.E>=scores.I?'E':'I')+(scores.S>=scores.N?'S':'N')+(scores.T>=scores.F?'T':'F')+(scores.J>=scores.P?'J':'P');
  return{type,scores};
}

function showResult(){
  const{type,scores}=calcType();
  const info=TYPES[type]||TYPES['INFP'];
  showScreen('screen-result');
  document.getElementById('res-emoji').textContent=info.emoji;
  document.getElementById('res-code').textContent=type;
  document.getElementById('res-name').textContent=info.name;

  const dims=[
    {l:'E',r:'I',ls:'외향',rs:'내향'},
    {l:'S',r:'N',ls:'감각',rs:'직관'},
    {l:'T',r:'F',ls:'사고',rs:'감정'},
    {l:'J',r:'P',ls:'판단',rs:'인식'},
  ];
  document.getElementById('trait-bars').innerHTML=dims.map(d=>{
    const lv=scores[d.l]||0,rv=scores[d.r]||0,tot=lv+rv||1;
    const lpct=Math.round(lv/tot*100);
    const dominant=lv>=rv?d.ls:d.rs;
    const pct=lv>=rv?lpct:100-lpct;
    return`<div class="trait-row">
      <div class="trait-labels"><span>${d.ls} (${d.l})</span><span>${d.rs} (${d.r})</span></div>
      <div class="trait-bar-bg"><div class="trait-bar-fill" style="width:${lpct}%"></div></div>
      <div class="trait-pct">${dominant} 성향 ${pct}%</div>
    </div>`;
  }).join('');

  document.getElementById('res-desc').innerHTML=`<p>${info.desc}</p>`;
  document.getElementById('res-traits').innerHTML=info.traits.map(t=>`<div class="trait-chip"><div class="trait-chip-title">${t[0]}</div><div class="trait-chip-desc">${t[1]}</div></div>`).join('');

  const allCompat=[...info.best.map(t=>({t,label:'최고 궁합',pct:93})),...info.good.map(t=>({t,label:'좋은 궁합',pct:74}))];
  document.getElementById('res-compat').innerHTML=allCompat.map(({t,label,pct})=>{
    const ti=TYPES[t];if(!ti)return'';
    const desc=info.compat&&info.compat[t]?info.compat[t]:label;
    return`<div class="compat-item">
      <div class="compat-type-code">${t}</div>
      <div class="compat-info"><div class="compat-name">${ti.name} · ${label}</div><div class="compat-desc">${desc}</div></div>
      <div class="compat-bar-wrap"><div class="compat-bar"><div class="compat-fill" style="width:${pct}%"></div></div><div class="compat-pct-label">${pct}%</div></div>
    </div>`;
  }).join('');
}

function restart(){answers=new Array(60).fill(null);current=0;showScreen('screen-start');}
</script>
</body>
</html>
